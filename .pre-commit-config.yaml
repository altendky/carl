repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: fix-byte-order-marker
      - id: mixed-line-ending

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args: [--offline, --no-progress, --min-severity=low]

  - repo: local
    hooks:
      - id: mise-lock
        name: mise lock
        entry: mise install --locked --dry-run
        language: system
        files: (^mise\.toml$|^mise\.lock$)
        pass_filenames: false

      - id: lychee-internal
        name: internal Markdown links
        entry: lychee --offline --include-fragments --no-progress
        language: system
        types: [markdown]

      - id: lychee-external
        name: external Markdown links (advisory)
        entry: lychee --config .lychee.toml
        language: system
        types: [markdown]
        stages: [manual]
